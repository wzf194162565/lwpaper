# Default: encrypted file storage, no database installation required.
# For MySQL, replace this file with application.mysql.example.properties
# and fill in the server-side connection settings before starting.
app.storage=file
app.fileMaxMb=50

# Password-recovery email. Use an SMTP app password; keep real credentials private.
mail.host=
mail.port=465
mail.security=ssl
mail.username=
mail.password=
mail.from=
