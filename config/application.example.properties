# 复制为 application.properties 后填写本机连接信息。实际配置文件已加入 .gitignore。
# file = 原加密文件模式；mysql = MySQL 关联表存储。
app.storage=mysql
# 单个稿件大小上限（MB，1–200）；账号稿件总量最多 512MB。
app.fileMaxMb=50
db.host=127.0.0.1
db.port=3306
db.name=lunwen
db.username=YOUR_DATABASE_USER
db.password=YOUR_DATABASE_PASSWORD
# 本机可使用 PREFERRED；公网部署应配置可信证书及 VERIFY_IDENTITY。
db.sslMode=PREFERRED
# 仅限受信任的本机连接；远程连接优先配置可信 TLS 证书。
# db.allowPublicKeyRetrieval=true
# 投稿密码使用独立密钥加密。迁移服务器时必须一起备份该文件。
# db.keyFile=C:/path/to/private/database.key

# 找回密码验证码邮件。填写 SMTP 授权码，不要使用邮箱登录密码或提交真实配置。
# QQ 邮箱示例：smtp.qq.com / 465 / ssl；163 邮箱：smtp.163.com / 465 / ssl。
# 也支持 587 / starttls。对应环境变量为 MAIL_HOST、MAIL_PORT、MAIL_SECURITY、
# MAIL_USERNAME、MAIL_PASSWORD、MAIL_FROM。
mail.host=
mail.port=465
mail.security=ssl
mail.username=
mail.password=
mail.from=
